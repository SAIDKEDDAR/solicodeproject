<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>input</title>
</head>
<body>
    
    <form>
        <label for="name">UserName:</label>
        <input type="text" id="name" maxlength="20" placeholder="write your name!" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" required  autocomplete="on"><br><br>

        <label for="pwr">Password:</label>
        <input type="password" id="pwr" required minlength="8"><br><br>

        <label for="age">Age:</label>
        <input type="number"  id="age" min="18" max="100"><br><br>

        <label for="phone">Phone:</label>
        <input type="tel" id="phone" pattern="[0-9]{9,15}"><br><br>
    </form>
</body>
</html>
